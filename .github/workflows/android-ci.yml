name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and assemble Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-edit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
